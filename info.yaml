# Tiny Tapeout project information
project:
  title: "ASILUC" # Project title
  author: "Gianluca Rainis" # Your name
  discord: "" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "An ASIC designed to function as an ALU." # One line description of what your project does
  language: "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 12000000 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module: "tt_um_gianluca_rainis_ASILUC"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_gianluca_rainis_ASILUC.v"
    - "phase_timer_ASILUC.v"
    - "calculation_ASILUC.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Numbers_input"
  ui[1]: "Numbers_input"
  ui[2]: "Numbers_input"
  ui[3]: "Numbers_input"
  ui[4]: "Numbers_input"
  ui[5]: "Numbers_input"
  ui[6]: "Numbers_input"
  ui[7]: "Numbers_input"

  # Outputs
  uo[0]: "Result_or_Error_code"
  uo[1]: "Result_or_Error_code"
  uo[2]: "Result_or_Error_code"
  uo[3]: "Result_or_Error_code"
  uo[4]: "Result"
  uo[5]: "Result"
  uo[6]: "Result"
  uo[7]: "Result"

  # Bidirectional pins
  uio[0]: "Command_input"
  uio[1]: "Command_input"
  uio[2]: "Command_input"
  uio[3]: "Command_input"
  uio[4]: "error"
  uio[5]: "highByte"
  uio[6]: "status"
  uio[7]: "busy"

# Do not change!
yaml_version: 6
